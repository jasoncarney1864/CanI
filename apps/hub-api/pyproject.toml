[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cani-hub-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cani-shared",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",             # OIDC discovery + token exchange
    "pyjwt[crypto]>=2.8",      # RS256 ID-token verification needs the cryptography extra
]

[tool.setuptools.packages.find]
include = ["hub_api_app*"]
