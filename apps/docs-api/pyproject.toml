[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cani-docs-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cani-shared",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "weasyprint>=69.0",
]

[tool.setuptools.packages.find]
include = ["docs_api_app*"]
