[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cani-retrieval-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cani-shared",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
include = ["retrieval_worker_app*"]
