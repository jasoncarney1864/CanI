[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/File() in argument defaults is the documented, idiomatic pattern —
# not the mutable-default-argument bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]
