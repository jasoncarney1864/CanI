apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-api
  namespace: docs-platform
  labels: { app: docs-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: docs-api }
  template:
    metadata:
      labels:
        app: docs-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: docs-api
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: docs-api
          image: canishareded20367db8.azurecr.io/docs-api:REPLACE_WITH_IMAGE_TAG
          ports: [{ containerPort: 8002 }]
          envFrom:
            - configMapRef: { name: cani-config }
            - secretRef: { name: cani-secrets }
          env:
            - { name: TMPDIR, value: "/tmp" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe: { httpGet: { path: /healthz, port: 8002 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 8002 }, initialDelaySeconds: 15 }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: cani-keyvault-secrets }
---
apiVersion: v1
kind: Service
metadata:
  name: docs-api
  namespace: docs-platform
spec:
  selector: { app: docs-api }
  ports: [{ port: 8002, targetPort: 8002 }]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docs-api
  namespace: docs-platform
  annotations:
    azure.workload.identity/client-id: "4a790202-610f-499c-bb0b-2c64b2d42898"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: docs-api
  namespace: docs-platform
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: docs-api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
