apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-worker
  namespace: docs-platform
  labels: { app: ingestion-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ingestion-worker }
  template:
    metadata:
      labels:
        app: ingestion-worker
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: ingestion-worker
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      # Interruption-tolerant per docs/10 §10.5 batchpool guidance: job claims use
      # SELECT ... FOR UPDATE SKIP LOCKED, so losing a pod mid-job just means another
      # replica (or this one after reschedule) picks it back up as retry_pending.
      tolerations:
        - { key: "dedicated", operator: "Equal", value: "batch", effect: "NoSchedule" }
      containers:
        - name: ingestion-worker
          image: canishareded20367db8.azurecr.io/ingestion-worker:REPLACE_WITH_IMAGE_TAG
          envFrom:
            - configMapRef: { name: cani-config }
            - secretRef: { name: cani-secrets }
          env:
            - { name: TMPDIR, value: "/tmp" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: cani-keyvault-secrets }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingestion-worker
  namespace: docs-platform
  annotations:
    azure.workload.identity/client-id: "4a790202-610f-499c-bb0b-2c64b2d42898"
# KEDA scaling objects live in scaling.yaml (separate file so it can be applied on its
# own — this file contains the REPLACE_WITH_IMAGE_TAG placeholder and must only be
# applied through the kustomize overlay).
