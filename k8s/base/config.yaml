# Non-secret configuration shared by docs-platform / hub-system workloads.
# Secret values NEVER live here — they come from Key Vault via the CSI driver
# (secret-provider-class.yaml), synced into the `cani-secrets` Secret and consumed via
# envFrom AFTER this ConfigMap. D1 (Sprint 3) split the previously-lumped config out of the
# `cani-secrets` Secret into this ConfigMap (real values, no more shadowing placeholders)
# and retired scripts/apply_dev_secrets.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cani-config
  namespace: docs-platform
data:
  ENV: "dev"
  QDRANT_URL: "http://qdrant.docs-platform.svc.cluster.local:6333"
  # v2 = the real 1536-dim text-embedding-3-small space. The original `cani_docs_dev`
  # collection was created at 32 dims by FakeEmbedder (no Azure OpenAI was ever configured
  # in-cluster). `QdrantVectorStore.ensure_collection` returns early when the collection
  # already exists and never validates dimensionality, so reusing the old name would leave
  # a 32-dim collection in place and fail every upsert. A new name gets a correctly-sized
  # collection without a destructive drop, and leaves the old one for rollback.
  QDRANT_COLLECTION: "cani_docs_dev_v2"
  RETRIEVAL_WORKER_URL: "http://retrieval-worker.docs-platform.svc.cluster.local:8003"
  AZURE_OPENAI_API_VERSION: "2024-10-21"
  AZURE_OPENAI_ENDPOINT: "https://cani-openai.openai.azure.com/"
  # Deployment names (not model names) — this is what the SDK addresses. Both are on the
  # regional `Standard` SKU rather than GlobalStandard, to stay inside the single-region
  # data-residency boundary set by docs/06-azure-landing-zone-design.md.
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "text-embedding-3-small"
  AZURE_OPENAI_CHAT_DEPLOYMENT: "gpt-5-1"
  POSTGRES_HOST: "cani-pg484bf91d.postgres.database.azure.com"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "cani"
  POSTGRES_USER: "caniadmin"
  AZURE_STORAGE_ACCOUNT_NAME: "cani6ada34dffd"
  # AZURE_STORAGE_ACCOUNT_ID (full ARM resource ID) was removed here: it hardcoded the old
  # subscription/resource-group, is not read anywhere in apps/shared-lib/cani_shared/config.py
  # or any app service (confirmed unused), and blocked retargeting to a new subscription.
  # AZURE_STORAGE_ACCOUNT_NAME above is what the apps actually use for blob SDK auth via
  # workload identity. If a future consumer genuinely needs the full ARM ID, source it via a
  # per-overlay kustomize patch (like the CI workflow's image-tag substitution) rather than
  # hardcoding it in this shared base ConfigMap.
  AZURE_DOCUMENTINTELLIGENCE_ENDPOINT: "https://cani-docintel.cognitiveservices.azure.com/"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cani-config
  namespace: hub-system
data:
  ENV: "dev"
  QDRANT_URL: "http://qdrant.docs-platform.svc.cluster.local:6333"
  QDRANT_COLLECTION: "cani_docs_dev_v2"
  POSTGRES_HOST: "cani-pg484bf91d.postgres.database.azure.com"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "cani"
  POSTGRES_USER: "caniadmin"
  AZURE_DOCUMENTINTELLIGENCE_ENDPOINT: "https://cani-docintel.cognitiveservices.azure.com/"
  ENTRA_OIDC_AUTHORITY: "https://caniauth.ciamlogin.com/43189f5e-8c1b-4e3f-9cf7-d17babc03e36/v2.0"
  ENTRA_OIDC_CLIENT_ID: "1f0927a0-fe19-4661-93e0-019e94b05416"
  ENTRA_OIDC_REDIRECT_URI: "https://app.canido.co/auth/callback"
