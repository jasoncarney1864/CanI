# Non-secret configuration shared by all docs-platform/hub-system workloads.
# Secret values never live in this ConfigMap or anywhere in git. Current dev reality:
# the `cani-secrets` Secret is applied out-of-band by scripts/apply_dev_secrets.sh from
# an operator-held env file (see runbooks/rotate-dev-secrets.md); that Secret also
# carries POSTGRES_HOST/QDRANT_* today, which override the placeholder values below via
# envFrom ordering (secretRef is listed after configMapRef in the deployments). Target
# state remains Key Vault via the CSI driver (secret-provider-class.yaml), at which point
# the connection/host values return here where they belong.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cani-config
  namespace: docs-platform
data:
  ENV: "dev"
  QDRANT_URL: "http://qdrant.docs-platform.svc.cluster.local:6333"
  QDRANT_COLLECTION: "cani_docs_dev"
  RETRIEVAL_WORKER_URL: "http://retrieval-worker.docs-platform.svc.cluster.local:8003"
  AZURE_OPENAI_API_VERSION: "2024-10-21"
  POSTGRES_HOST: "REPLACE_WITH_POSTGRES_FQDN"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "cani"
  POSTGRES_USER: "caniadmin"
  AZURE_STORAGE_ACCOUNT_NAME: "cani9820b2c229"
  AZURE_STORAGE_ACCOUNT_ID: "/subscriptions/6591cee6-ee26-4155-ae71-3777bf7e9c73/resourceGroups/cani-workload-core-dev-eastus2-rg9c8e66d0/providers/Microsoft.Storage/storageAccounts/cani9820b2c229"
  AZURE_STORAGE_CONNECTION_STRING: "REPLACE_WITH_MANAGED_IDENTITY_BLOB_CONNECTION"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cani-config
  namespace: hub-system
data:
  ENV: "dev"
  POSTGRES_HOST: "REPLACE_WITH_POSTGRES_FQDN"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "cani"
  POSTGRES_USER: "caniadmin"
