# Scheduled Qdrant snapshot -> Blob Storage (docs/09 §9.10, Sprint 2 C1).
# Runs on the ingestion-worker image (it carries httpx + the blob SDK); the kustomize
# image transformer rewrites this tag to the same immutable SHA as the deployment, so
# the CronJob always runs the current build. Restore is a manual operator action —
# see runbooks/backup-restore-drill.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qdrant-snapshot
  namespace: docs-platform
  labels: { app: qdrant-snapshot }
spec:
  schedule: "0 2 * * *" # daily 02:00 UTC
  concurrencyPolicy: Forbid # never run two snapshots at once
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2 # a couple of retries, then the Job is marked failed
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: { app: qdrant-snapshot }
        spec:
          restartPolicy: Never
          serviceAccountName: ingestion-worker
          securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
          tolerations:
            - { key: "dedicated", operator: "Equal", value: "batch", effect: "NoSchedule" }
          containers:
            - name: qdrant-snapshot
              image: canishareded20367db8.azurecr.io/ingestion-worker:REPLACE_WITH_IMAGE_TAG
              command: ["python", "-m", "cani_shared.backup"]
              envFrom:
                - configMapRef: { name: cani-config }
                - secretRef: { name: cani-secrets }
              env:
                - { name: TMPDIR, value: "/tmp" }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: "200m", memory: "256Mi" }
                limits: { cpu: "1", memory: "1Gi" }
          volumes:
            - { name: tmp, emptyDir: {} }
