# Key Vault CSI driver mounts secret material at runtime per docs/10 §10.6 and
# docs/14-security-and-compliance.md §14.10 — no plaintext secrets in manifests, ever.
# `tenantId`/`keyvaultName` are placeholders filled in per-environment by the overlay
# (or by the deploy workflow); not usable until infra/platform's Key Vault exists.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cani-keyvault-secrets
  namespace: docs-platform
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "REPLACE_WITH_WORKLOAD_IDENTITY_CLIENT_ID"
    keyvaultName: "REPLACE_WITH_KEYVAULT_NAME"
    tenantId: "REPLACE_WITH_TENANT_ID"
    objects: |
      array:
        - |
          objectName: cani-token-signing-secret
          objectType: secret
        - |
          objectName: azure-openai-api-key
          objectType: secret
        - |
          objectName: azure-documentintelligence-api-key
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
  secretObjects:
    - secretName: cani-secrets
      type: Opaque
      data:
        - objectName: cani-token-signing-secret
          key: CANI_TOKEN_SIGNING_SECRET
        - objectName: azure-openai-api-key
          key: AZURE_OPENAI_API_KEY
        - objectName: azure-documentintelligence-api-key
          key: AZURE_DOCUMENTINTELLIGENCE_API_KEY
        - objectName: postgres-password
          key: POSTGRES_PASSWORD
---
# hub-api needs the session secret in addition to the token-signing secret; kept as a
# separate SecretProviderClass since it lives in the hub-system namespace.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cani-keyvault-secrets
  namespace: hub-system
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "REPLACE_WITH_WORKLOAD_IDENTITY_CLIENT_ID"
    keyvaultName: "REPLACE_WITH_KEYVAULT_NAME"
    tenantId: "REPLACE_WITH_TENANT_ID"
    objects: |
      array:
        - |
          objectName: cani-token-signing-secret
          objectType: secret
        - |
          objectName: cani-session-secret
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
  secretObjects:
    - secretName: cani-secrets
      type: Opaque
      data:
        - objectName: cani-token-signing-secret
          key: CANI_TOKEN_SIGNING_SECRET
        - objectName: cani-session-secret
          key: CANI_SESSION_SECRET
        - objectName: postgres-password
          key: POSTGRES_PASSWORD
