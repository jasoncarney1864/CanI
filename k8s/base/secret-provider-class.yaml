# Key Vault CSI driver mounts secret material at runtime per docs/10 §10.6 and
# docs/14-security-and-compliance.md §14.10 — no plaintext secrets in manifests, ever.
# clientID = the cani-secrets workload identity (managed by infra/workload); keyvaultName =
# the platform KV; both are non-secret identifiers, filled directly (D1). The CSI driver
# syncs KV secrets into the `cani-secrets` Secret (+ `cani-keda-postgres`) via secretObjects,
# which materialize only when a pod in the namespace mounts this SPC as a volume.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cani-keyvault-secrets
  namespace: docs-platform
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "984dbce5-2209-4df0-b904-41bdcce2596c"
    keyvaultName: "cani-platform-kv2e5cf1f6"
    tenantId: "641146b0-a933-4bd1-b7cd-c7cbafcbba01"
    objects: |
      array:
        - |
          objectName: cani-token-signing-secret
          objectType: secret
        - |
          objectName: cani-session-secret
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: azure-storage-connection-string
          objectType: secret
        - |
          objectName: azure-documentintelligence-api-key
          objectType: secret
        - |
          objectName: applicationinsights-connection-string
          objectType: secret
        - |
          objectName: keda-postgres-connection
          objectType: secret
  secretObjects:
    - secretName: cani-secrets
      type: Opaque
      data:
        - { objectName: cani-token-signing-secret, key: CANI_TOKEN_SIGNING_SECRET }
        - { objectName: cani-session-secret, key: CANI_SESSION_SECRET }
        - { objectName: postgres-password, key: POSTGRES_PASSWORD }
        - { objectName: azure-storage-connection-string, key: AZURE_STORAGE_CONNECTION_STRING }
        - { objectName: azure-documentintelligence-api-key, key: AZURE_DOCUMENTINTELLIGENCE_API_KEY }
        - { objectName: applicationinsights-connection-string, key: APPLICATIONINSIGHTS_CONNECTION_STRING }
    # KEDA's postgresql trigger reads this Secret (key `connection`) via the
    # cani-postgres-keda-auth TriggerAuthentication (ingestion-worker/scaling.yaml).
    - secretName: cani-keda-postgres
      type: Opaque
      data:
        - { objectName: keda-postgres-connection, key: connection }
---
# hub-api additionally needs the Entra OIDC client secret; it lives in hub-system.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cani-keyvault-secrets
  namespace: hub-system
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "984dbce5-2209-4df0-b904-41bdcce2596c"
    keyvaultName: "cani-platform-kv2e5cf1f6"
    tenantId: "641146b0-a933-4bd1-b7cd-c7cbafcbba01"
    objects: |
      array:
        - |
          objectName: cani-token-signing-secret
          objectType: secret
        - |
          objectName: cani-session-secret
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: azure-storage-connection-string
          objectType: secret
        - |
          objectName: azure-documentintelligence-api-key
          objectType: secret
        - |
          objectName: applicationinsights-connection-string
          objectType: secret
        - |
          objectName: entra-oidc-client-secret
          objectType: secret
  secretObjects:
    - secretName: cani-secrets
      type: Opaque
      data:
        - { objectName: cani-token-signing-secret, key: CANI_TOKEN_SIGNING_SECRET }
        - { objectName: cani-session-secret, key: CANI_SESSION_SECRET }
        - { objectName: postgres-password, key: POSTGRES_PASSWORD }
        - { objectName: azure-storage-connection-string, key: AZURE_STORAGE_CONNECTION_STRING }
        - { objectName: azure-documentintelligence-api-key, key: AZURE_DOCUMENTINTELLIGENCE_API_KEY }
        - { objectName: applicationinsights-connection-string, key: APPLICATIONINSIGHTS_CONNECTION_STRING }
        - { objectName: entra-oidc-client-secret, key: ENTRA_OIDC_CLIENT_SECRET }
