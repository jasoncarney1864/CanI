# NetworkPolicy: deny-by-default, then explicit allows (docs/10 §10.10, docs/14 §14.6).
#
# Written for the ACTUAL dev topology, which is not pure pod-to-pod:
#   - Postgres is Azure Flexible Server on the delegated subnet 10.1.5.0/24 (an IP block,
#     not a pod) — reached on 5432.
#   - Blob and Entra are external HTTPS (443); Calico can't match FQDNs or service tags, so
#     443 egress is allowed to the internet with the internal ranges excluded.
#   - Azure OpenAI and Document Intelligence are NO LONGER external. They sit behind private
#     endpoints on 10.1.4.0/24, which the `except: [10.1.0.0/16]` below deliberately blocks,
#     so each caller needs an explicit allow to that subnet. **Any future service moved to a
#     private endpoint needs the same treatment** — and the symptom is a connect timeout, not
#     a DNS or TLS error, because the name resolves fine and only the packets are dropped.
#   - CoreDNS lives in kube-system; DNS egress targets its pods (post-DNAT), not the
#     10.0.0.10 service IP.
#   - kubelet health probes originate from the node subnet 10.1.0.0/22, so each pod that
#     has probes allows ingress from that block on its port.
#
# Calico is the active policy engine on cani-aks33874b17, so these are enforced, not inert.

# =========================== hub-system ===========================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-default
  namespace: hub-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hub-api
  namespace: hub-system
spec:
  podSelector: { matchLabels: { app: hub-api } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.1.0.0/22 } # kubelet health probes
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: docs-platform } }
          podSelector: { matchLabels: { app: web } } # the web app's server-side auth proxy
      ports: [{ port: 8001, protocol: TCP }]
  egress:
    - to: [{ ipBlock: { cidr: 10.1.5.0/24 } }] # Postgres Flexible Server
      ports: [{ port: 5432, protocol: TCP }]
    - to: # CoreDNS
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to: # external HTTPS (Entra OIDC), internal ranges excluded
        - ipBlock: { cidr: 0.0.0.0/0, except: [10.244.0.0/16, 10.0.0.0/16, 10.1.0.0/16] }
      ports: [{ port: 443, protocol: TCP }]
---
# =========================== docs-platform ===========================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-default
  namespace: docs-platform
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docs-api
  namespace: docs-platform
spec:
  podSelector: { matchLabels: { app: docs-api } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.1.0.0/22 } # kubelet health probes
        - podSelector: { matchLabels: { app: web } } # the web app's server-side proxy
      ports: [{ port: 8002, protocol: TCP }]
  egress:
    - to: [{ podSelector: { matchLabels: { app: retrieval-worker } } }]
      ports: [{ port: 8003, protocol: TCP }]
    - to: [{ ipBlock: { cidr: 10.1.5.0/24 } }] # Postgres
      ports: [{ port: 5432, protocol: TCP }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to: # Blob Storage over HTTPS
        - ipBlock: { cidr: 0.0.0.0/0, except: [10.244.0.0/16, 10.0.0.0/16, 10.1.0.0/16] }
      ports: [{ port: 443, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: retrieval-worker
  namespace: docs-platform
spec:
  podSelector: { matchLabels: { app: retrieval-worker } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: docs-api } } # docs-api gateway calls
        - ipBlock: { cidr: 10.1.0.0/22 } # kubelet health probes
      ports: [{ port: 8003, protocol: TCP }]
  egress:
    - to: [{ podSelector: { matchLabels: { app: qdrant } } }]
      ports: [{ port: 6333, protocol: TCP }]
    - to: [{ ipBlock: { cidr: 10.1.5.0/24 } }] # Postgres
      ports: [{ port: 5432, protocol: TCP }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to: # Azure OpenAI (embeddings + chat) — private endpoint on 10.1.4.0/24
        - ipBlock: { cidr: 10.1.4.0/24 }
      ports: [{ port: 443, protocol: TCP }]
    - to: # remaining external HTTPS, internal ranges excluded
        - ipBlock: { cidr: 0.0.0.0/0, except: [10.244.0.0/16, 10.0.0.0/16, 10.1.0.0/16] }
      ports: [{ port: 443, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingestion-worker
  namespace: docs-platform
spec:
  podSelector: { matchLabels: { app: ingestion-worker } }
  # Egress only — the worker is a queue poller with no inbound server.
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: qdrant } } }]
      ports: [{ port: 6333, protocol: TCP }]
    - to: [{ ipBlock: { cidr: 10.1.5.0/24 } }] # Postgres
      ports: [{ port: 5432, protocol: TCP }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to: # Azure OpenAI (embeddings) + Document Intelligence (OCR) — private endpoints
        - ipBlock: { cidr: 10.1.4.0/24 }
      ports: [{ port: 443, protocol: TCP }]
    - to: # Blob Storage + remaining external HTTPS, internal ranges excluded
        - ipBlock: { cidr: 0.0.0.0/0, except: [10.244.0.0/16, 10.0.0.0/16, 10.1.0.0/16] }
      ports: [{ port: 443, protocol: TCP }]
---
# Qdrant snapshot CronJob (§9.10, C1): reads snapshots from Qdrant and pushes them to
# Blob over HTTPS. No Postgres — it never touches the metadata DB.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-snapshot
  namespace: docs-platform
spec:
  podSelector: { matchLabels: { app: qdrant-snapshot } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: qdrant } } }]
      ports: [{ port: 6333, protocol: TCP }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to: # Blob Storage over HTTPS
        - ipBlock: { cidr: 0.0.0.0/0, except: [10.244.0.0/16, 10.0.0.0/16, 10.1.0.0/16] }
      ports: [{ port: 443, protocol: TCP }]
---
# Qdrant: reachable only by the two workers + the snapshot job (§8.11), plus node probes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant
  namespace: docs-platform
spec:
  podSelector: { matchLabels: { app: qdrant } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: retrieval-worker } }
        - podSelector: { matchLabels: { app: ingestion-worker } }
        - podSelector: { matchLabels: { app: qdrant-snapshot } }
        - ipBlock: { cidr: 10.1.0.0/22 } # kubelet health probes
      ports: [{ port: 6333, protocol: TCP }]
  egress:
    - to: # DNS only — Qdrant creates the snapshot on its PVC; the CronJob does the upload
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
# The CD migration Job (labelled app=migrate by the workflow) needs Postgres + DNS under
# deny-all, or the migration gate in app-cd-dev would fail once enforcement is on.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migrate-job
  namespace: docs-platform
spec:
  podSelector: { matchLabels: { app: migrate } }
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: 10.1.5.0/24 } }]
      ports: [{ port: 5432, protocol: TCP }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
# Web app: reachable by kubelet probes now, and by the ingress controller once C1 lands.
# Egresses only to the two APIs it proxies (docs-api same-ns, hub-api cross-ns) + DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web
  namespace: docs-platform
spec:
  podSelector: { matchLabels: { app: web } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ ipBlock: { cidr: 10.1.0.0/22 } }] # kubelet health probes (ingress ctrl added in C1)
      ports: [{ port: 3000, protocol: TCP }]
  egress:
    - to: [{ podSelector: { matchLabels: { app: docs-api } } }]
      ports: [{ port: 8002, protocol: TCP }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: hub-system } }
          podSelector: { matchLabels: { app: hub-api } }
      ports: [{ port: 8001, protocol: TCP }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
# Managed NGINX ingress controller (app-routing-system) -> web pod. Additive to the `web`
# policy above; multiple policies selecting a pod are OR'd (Sprint 3 C1).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-ingress
  namespace: docs-platform
spec:
  podSelector: { matchLabels: { app: web } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: app-routing-system } }
      ports: [{ port: 3000, protocol: TCP }]
---
# cert-manager HTTP-01 ACME solver pods are created in this namespace (same ns as the web
# Ingress) and would be blocked by deny-all. Allow the NGINX controller to reach them on
# the solver port, plus DNS egress (Sprint 3 C1).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-http01-solver
  namespace: docs-platform
spec:
  podSelector: { matchLabels: { acme.cert-manager.io/http01-solver: "true" } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: app-routing-system } }
      ports: [{ port: 8089, protocol: TCP }]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
