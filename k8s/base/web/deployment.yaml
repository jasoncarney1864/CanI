# CanI web app (Next.js). Lives in docs-platform: it talks to docs-api (same namespace)
# and hub-api (hub-system, cross-namespace) via its server-side proxy. The browser only
# ever reaches this pod — the backend APIs stay private (NetworkPolicy below).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: docs-platform
  labels: { app: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: canishareded20367db8.azurecr.io/web:REPLACE_WITH_IMAGE_TAG
          ports: [{ containerPort: 3000 }]
          env:
            # In-cluster backends for the server-side proxy (lib/backendAuth). The browser
            # never sees these — it only calls this app's /api/* routes.
            - { name: HUB_API_URL, value: "http://hub-api.hub-system:8001" }
            - { name: DOCS_API_URL, value: "http://docs-api:8002" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe: { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 15 }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "384Mi" }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: next-cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: docs-platform
spec:
  selector: { app: web }
  ports: [{ port: 3000, targetPort: 3000 }]
