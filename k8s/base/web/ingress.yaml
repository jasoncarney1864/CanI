# Public HTTPS ingress for the web app (Sprint 3 C1). Only the web app is exposed; the
# backend APIs stay private and are reached solely via the web app's server-side proxy.
#
# Host is the custom domain app.canido.co (A record -> the managed-NGINX static LB IP
# 172.175.33.251). cert-manager fills the web-tls secret with a Let's Encrypt cert for this
# host (HTTP-01 via the nginx class). If the ingress LoadBalancer IP ever changes, update
# the GoDaddy A record for `app` — the host here stays app.canido.co.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: docs-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # NGINX defaults to a 1 MB client body limit, which 413s any real document upload.
    # Raise it to match the app/docs-api cap (25 MB) plus a little multipart overhead.
    nginx.ingress.kubernetes.io/proxy-body-size: "26m"
    # Edge rate limiting (Sprint 3 C3): a global per-client-IP throttle in front of the app,
    # complementing the Sprint 2 per-pod service-layer limit. 20 req/s sustained with a
    # burst bucket (20 x 5 = 100) absorbs a normal page load / status polling, but throttles
    # a flood (NGINX returns 503 once the bucket drains). 20 concurrent connections per IP.
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "20"
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts: ["app.canido.co"]
      secretName: web-tls
  rules:
    - host: "app.canido.co"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 3000 } }
