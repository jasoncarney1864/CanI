apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Dev cost posture (docs/15-cost-management.md §15.7): single replica per stateless
# service instead of base's production-sized 2, no reserved baseline beyond that.
patches:
  - target: { kind: Deployment, name: hub-api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: docs-api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: retrieval-worker }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

images:
  - name: cani.azurecr.io/hub-api
    newTag: dev
  - name: cani.azurecr.io/docs-api
    newTag: dev
  - name: cani.azurecr.io/retrieval-worker
    newTag: dev
  - name: cani.azurecr.io/ingestion-worker
    newTag: dev
