name: infra-preview

# Requires Azure OIDC federated credentials configured as repo/environment secrets
# (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID) before this can run for real —
# not configured this session (docs/12-cicd-strategy.md §12.6). See the launch-readiness
# gap report.

on:
  pull_request:
    paths:
      - "infra/**"

jobs:
  preview:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [platform, workload]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: pulumi/actions@v5
        with:
          command: preview
          stack-name: dev
          work-dir: infra/${{ matrix.project }}
          comment-on-pr: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
