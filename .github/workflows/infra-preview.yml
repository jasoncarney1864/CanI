name: infra-preview

# Requires Azure OIDC federated credentials configured as repo secrets
# (AZURE_CLIENT_ID_PLATFORM, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID). These were repointed at
# the canido tenant on 2026-08-04 — they had still named the pre-migration tenant, and nothing
# caught it because `pulumi preview` only contacts Azure for resources it must read (imports,
# refreshes). Every run since the migration reported "38 unchanged" without making a single
# authenticated call, so the workflow stayed green while being completely unable to deploy.

on:
  pull_request:
    paths:
      - "infra/**"

jobs:
  preview:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [platform, workload]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PLATFORM }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: pulumi/actions@v5
        with:
          command: preview
          stack-name: canido-dev
          work-dir: infra/${{ matrix.project }}
          comment-on-pr: true
          # Without this the preview only reports *that* a resource changes, not what
          # changes about it — which is unreviewable for anything that says `~properties`,
          # and worthless for the one case that matters most: confirming an adoption
          # imports cleanly rather than quietly rewriting a live resource.
          diff: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
