name: app-cd-dev

# Targets the live dev workload stack outputs from infra/workload (Pulumi update v6).
# Keep these values in sync with `pulumi stack output --stack dev --json`.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"

env:
  AKS_RESOURCE_GROUP: cani-workload-core-dev-eastus2-rg9c8e66d0
  AKS_CLUSTER_NAME: cani-aks64bdb7d1
  ACR_NAME: canishareded20367db8
  ACR_LOGIN_SERVER: canishareded20367db8.azurecr.io
  ACR_ID_REFERENCE: /subscriptions/6591cee6-ee26-4155-ae71-3777bf7e9c73/resourceGroups/cani-platform-core-dev-eastus2-rg1227b5a0/providers/Microsoft.ContainerRegistry/registries/canishareded20367db8
  WORKLOAD_STORAGE_ACCOUNT_ID: /subscriptions/6591cee6-ee26-4155-ae71-3777bf7e9c73/resourceGroups/cani-workload-core-dev-eastus2-rg9c8e66d0/providers/Microsoft.Storage/storageAccounts/cani9820b2c229

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        service: [hub-api, docs-api, ingestion-worker, retrieval-worker]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_WORKLOAD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image (immutable tag, never `latest`)
        run: |
          az acr login --name ${{ env.ACR_NAME }}
          docker build -f apps/${{ matrix.service }}/Dockerfile -t ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ github.sha }} .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_WORKLOAD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Validate workload contract IDs before deploy
        run: |
          az aks show -g ${{ env.AKS_RESOURCE_GROUP }} -n ${{ env.AKS_CLUSTER_NAME }} --query id -o tsv > /tmp/aks_id
          az resource show --ids ${{ env.WORKLOAD_STORAGE_ACCOUNT_ID }} --query id -o tsv > /tmp/storage_id
          ACR_ID=$(az acr show --name ${{ env.ACR_NAME }} --query id -o tsv)
          if [ "$ACR_ID" != "${{ env.ACR_ID_REFERENCE }}" ]; then
            echo "ACR ID mismatch. Expected ${{ env.ACR_ID_REFERENCE }}, got $ACR_ID"
            exit 1
          fi

      - name: Set image tags and apply
        run: |
          cd k8s/overlays/dev
          kustomize edit set image \
            ${{ env.ACR_LOGIN_SERVER }}/hub-api=${{ env.ACR_LOGIN_SERVER }}/hub-api:${{ github.sha }} \
            ${{ env.ACR_LOGIN_SERVER }}/docs-api=${{ env.ACR_LOGIN_SERVER }}/docs-api:${{ github.sha }} \
            ${{ env.ACR_LOGIN_SERVER }}/retrieval-worker=${{ env.ACR_LOGIN_SERVER }}/retrieval-worker:${{ github.sha }} \
            ${{ env.ACR_LOGIN_SERVER }}/ingestion-worker=${{ env.ACR_LOGIN_SERVER }}/ingestion-worker:${{ github.sha }}
          kubectl apply -k .
          kubectl rollout status deployment/hub-api -n hub-system
          kubectl rollout status deployment/docs-api -n docs-platform
          kubectl rollout status deployment/retrieval-worker -n docs-platform

      - name: Post-deploy smoke check
        run: |
          curl -sf https://dev.cani.internal/healthz || (echo "smoke check failed" && exit 1)
