name: infra-apply-dev

# Requires Azure OIDC federated credentials + a Pulumi state backend — not configured
# this session. See docs/implementation-status.md before enabling this trigger for real.

on:
  push:
    branches: [main]
    paths:
      - "infra/**"

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      matrix:
        project: [platform, workload]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: pulumi/actions@v5
        with:
          command: up
          stack-name: dev
          work-dir: infra/${{ matrix.project }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
