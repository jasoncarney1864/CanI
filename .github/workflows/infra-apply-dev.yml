name: infra-apply-dev

# Platform MUST fully apply before workload starts: workload consumes platform stack
# outputs via StackReference (§11.6 contract — log_analytics_workspace_id,
# ops_action_group_id, ...), and a StackReference read races a concurrent platform
# apply. The original parallel matrix hit exactly that on 2026-07-17: workload read
# ops_action_group_id before platform exported it (MetricAlert 400), and matrix
# fail-fast then CANCELED the platform `pulumi up` mid-create — a canceled apply can
# leave pending operations in state, which is strictly worse than a failed one.
# Sequential jobs make the dependency explicit and remove the cancellation hazard.

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
  workflow_dispatch: {}

jobs:
  apply-platform:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PLATFORM }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: pulumi/actions@v5
        with:
          command: up
          stack-name: canido-dev
          work-dir: infra/platform
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  apply-workload:
    runs-on: ubuntu-latest
    environment: dev
    needs: apply-platform
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PLATFORM }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: pulumi/actions@v5
        with:
          command: up
          stack-name: canido-dev
          work-dir: infra/workload
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
