name: container-apps-cd-dev

# Container Apps CD workflow - replaces AKS deployment
# Cost savings: ~50-70% by eliminating AKS node pools & management fees
# This workflow deploys to Azure Container Apps instead of AKS

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "db/**"
      - "infra/container-apps/**"
  workflow_dispatch: {}

env:
  RESOURCE_GROUP: ${{ vars.CONTAINER_APPS_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  # Gate the whole workflow on configuration being present, before anything builds or
  # deploys. An unset variable expands to an empty string, so `az` receives `-g ''` and
  # answers "argument --resource-group/-g: expected one argument" followed by twenty
  # lines of usage examples — which reads as a malformed command rather than as missing
  # config, and only after the six image builds have already run.
  #
  # Runs as its own job rather than a step so it executes once instead of once per
  # matrix leg, and needs `environment: dev` to see environment-scoped variables.
  check-config:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Verify required variables are set
        env:
          RESOURCE_GROUP: ${{ vars.CONTAINER_APPS_RESOURCE_GROUP }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          KEY_VAULT_URI: ${{ vars.KEY_VAULT_URI }}
          MANAGED_IDENTITY_ID: ${{ vars.MANAGED_IDENTITY_ID }}
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
        shell: bash
        run: |
          set -uo pipefail
          missing=()
          # $1 = env var checked, $2 = the GitHub variable name to tell the user about
          require() { [ -n "${!1:-}" ] || missing+=("$2"); }

          require RESOURCE_GROUP     CONTAINER_APPS_RESOURCE_GROUP
          require ACR_NAME           ACR_NAME
          require ACR_LOGIN_SERVER   ACR_LOGIN_SERVER
          require KEY_VAULT_URI      KEY_VAULT_URI
          require MANAGED_IDENTITY_ID MANAGED_IDENTITY_ID
          require POSTGRES_HOST      POSTGRES_HOST

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Unset GitHub variable(s): ${missing[*]}"
            echo "Set them under Settings -> Environments -> dev -> Variables."
            echo "Current values for this environment are in infra/container-apps/main.parameters.json."
            exit 1
          fi

          # KEY_VAULT_URI is concatenated straight onto 'secrets/NAME' when the
          # keyvaultref is built, so a missing trailing slash silently produces
          # '...vault.azure.netsecrets/POSTGRES-PASSWORD' and fails later, further away.
          case "$KEY_VAULT_URI" in
            */) ;;
            *) echo "::error::KEY_VAULT_URI must end with '/' (got '$KEY_VAULT_URI')"; exit 1 ;;
          esac

          echo "All six required variables are set."

  build-and-push:
    runs-on: ubuntu-latest
    needs: check-config
    environment: dev
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include:
          - { service: hub-api, dockerfile: apps/hub-api/Dockerfile }
          - { service: docs-api, dockerfile: apps/docs-api/Dockerfile }
          - { service: ingestion-worker, dockerfile: apps/ingestion-worker/Dockerfile }
          - { service: retrieval-worker, dockerfile: apps/retrieval-worker/Dockerfile }
          - { service: web, dockerfile: apps/web/Dockerfile }
          - { service: migrate, dockerfile: db/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_WORKLOAD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image (immutable tag)
        run: |
          az acr login --name ${{ env.ACR_NAME }}
          docker build -f ${{ matrix.dockerfile }} -t ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ github.sha }} .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_WORKLOAD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run database migrations
        # Container Apps Job - runs migration before app updates
        run: |
          JOB_NAME="cani-migrate-$(echo ${{ github.sha }} | cut -c1-12)"
          
          # Create/update migration job
          az containerapp job create \
            --name ${JOB_NAME} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment cani-env-dev \
            --trigger-type Manual \
            --replica-timeout 300 \
            --replica-retry-limit 2 \
            --image ${{ env.ACR_LOGIN_SERVER }}/migrate:${{ github.sha }} \
            --registry-server ${{ env.ACR_LOGIN_SERVER }} \
            --mi-user-assigned ${{ vars.MANAGED_IDENTITY_ID }} \
            --registry-identity ${{ vars.MANAGED_IDENTITY_ID }} \
            --cpu 0.5 --memory 1Gi \
            --secrets postgres-password=keyvaultref:${{ vars.KEY_VAULT_URI }}secrets/POSTGRES-PASSWORD,identityref:${{ vars.MANAGED_IDENTITY_ID }} \
            --env-vars \
              POSTGRES_HOST=${{ vars.POSTGRES_HOST }} \
              POSTGRES_PORT=5432 \
              POSTGRES_DB=cani \
              POSTGRES_USER=caniadmin \
              POSTGRES_PASSWORD=secretref:postgres-password \
            || az containerapp job update \
            --name ${JOB_NAME} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/migrate:${{ github.sha }}
          
          # Execute migration
          EXECUTION_NAME=$(az containerapp job start \
            --name ${JOB_NAME} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query name -o tsv)
          
          echo "Migration execution: $EXECUTION_NAME"
          
          # Wait for completion (timeout after 3 minutes)
          TIMEOUT=180
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            # Argument shape changed in the containerapp extension: -n/--name is the
            # JOB, and the execution goes in --job-execution-name. The old
            # --name=<execution> --job-name=<job> form exits 2 before ever polling.
            STATUS=$(az containerapp job execution show \
              --name ${JOB_NAME} \
              --job-execution-name $EXECUTION_NAME \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query properties.status -o tsv)

            if [ "$STATUS" == "Succeeded" ]; then
              echo "✅ Migration completed successfully"
              az containerapp job logs show \
                --name ${JOB_NAME} \
                --execution $EXECUTION_NAME \
                --container ${JOB_NAME} \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --format text || true
              break
            elif [ "$STATUS" == "Failed" ]; then
              echo "❌ Migration failed"
              az containerapp job logs show \
                --name ${JOB_NAME} \
                --execution $EXECUTION_NAME \
                --container ${JOB_NAME} \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --format text || true
              exit 1
            fi
            
            echo "Migration status: $STATUS (${ELAPSED}s elapsed)"
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "❌ Migration timed out after ${TIMEOUT}s"
            exit 1
          fi

      - name: Deploy Hub API
        run: |
          az containerapp update \
            --name hub-api \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/hub-api:${{ github.sha }} \
            --revision-suffix sha-$(echo ${{ github.sha }} | cut -c1-7)

      - name: Deploy Docs API
        run: |
          az containerapp update \
            --name docs-api \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/docs-api:${{ github.sha }} \
            --revision-suffix sha-$(echo ${{ github.sha }} | cut -c1-7)

      - name: Deploy Web
        run: |
          az containerapp update \
            --name web \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/web:${{ github.sha }} \
            --revision-suffix sha-$(echo ${{ github.sha }} | cut -c1-7)

      - name: Deploy Ingestion Worker
        run: |
          az containerapp update \
            --name ingestion-worker \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/ingestion-worker:${{ github.sha }} \
            --revision-suffix sha-$(echo ${{ github.sha }} | cut -c1-7)

      - name: Deploy Retrieval Worker
        run: |
          az containerapp update \
            --name retrieval-worker \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/retrieval-worker:${{ github.sha }} \
            --revision-suffix sha-$(echo ${{ github.sha }} | cut -c1-7)

      - name: Post-deploy smoke checks
        run: |
          # hub-api, docs-api and retrieval-worker have INTERNAL ingress. Their FQDNs
          # resolve publicly to the environment's envoy, but envoy answers 404 for
          # external hits on internal apps — so curling them from this runner can never
          # succeed and never could (first exercised 2026-08-11, failed immediately).
          #
          # Assert revision health instead. A revision is Healthy only when its
          # readiness probe passes, and retrieval-worker's readiness probe is /readyz,
          # which does a live Qdrant call — so "retrieval-worker revision Healthy"
          # still means "Qdrant reachable with the deployed credentials", which is the
          # check that would have caught the 2026-08-09 outage at deploy time.
          for APP in hub-api docs-api retrieval-worker; do
            echo "🔍 Waiting for $APP latest revision to be Healthy..."
            DEADLINE=$((SECONDS + 180))
            while true; do
              STATE=$(az containerapp revision list \
                --name $APP \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --query "[?properties.active] | [0].properties.healthState" -o tsv)
              if [ "$STATE" == "Healthy" ]; then
                echo "✅ $APP revision Healthy"
                break
              fi
              if [ $SECONDS -ge $DEADLINE ]; then
                echo "❌ $APP revision not Healthy after 180s (state: ${STATE:-unknown})"
                exit 1
              fi
              echo "   $APP: ${STATE:-unknown}, waiting..."
              sleep 10
            done
          done

          # web is the one app with external ingress — a real HTTP check works here.
          WEB_FQDN=$(az containerapp show --name web --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          echo "🔍 Checking web health (public ingress)..."
          curl -f https://$WEB_FQDN/api/health || exit 1

          echo "✅ All smoke checks passed"
