name: CI

on:
  pull_request:
    paths:
      - "apps/**"
      - "db/**"
      - "tests/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "db/**"
      - "tests/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  # Run on demand. The path filters mean a fix that lives outside apps/db/tests cannot
  # re-run CI: the secret-scan failure on 5b15408 was fixed in 0e560d6, which touched
  # only infra/, so main stayed red with no way to re-verify short of an unrelated
  # commit to a watched path.
  workflow_dispatch: {}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    # gitleaks-action enumerates PR commits via the GitHub API and posts findings as PR
    # comments — without these grants the default read-only token 403s ("Resource not
    # accessible by integration") before any scanning happens.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check apps tests db

      - name: Format check (ruff format)
        run: ruff format --check apps tests db

      - name: Unit tests
        # No Azure OpenAI/Document Intelligence keys are available in CI — provider
        # factories automatically fall back to deterministic fakes (cani_shared.providers.factory),
        # so this never depends on live credentials.
        run: pytest tests/unit -v

  web-test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  compose-smoke-deploy:
    runs-on: ubuntu-latest
    needs: [secret-scan, lint-and-unit-test, web-test-and-build]
    # Builds every service image and drives the real
    # auth->upload->ingest->retrieve->cite flow against them.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate dev secrets
        run: |
          cp .env.example .env
          sed -i "s|CANI_TOKEN_SIGNING_SECRET=|CANI_TOKEN_SIGNING_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')|" .env
          sed -i "s|CANI_SESSION_SECRET=|CANI_SESSION_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')|" .env

      - name: Run integration tests against docker-compose
        env:
          CANI_SKIP_COMPOSE: "0"
        run: pytest tests/integration -v

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -500

      - name: Tear down
        if: always()
        run: docker compose down -v
