name: deploy

# Deploy infra/container-apps/main.bicep and the six service images to Azure Container
# Apps. Images are built IN Azure (`az acr build`) into the Basic-tier registry the
# template creates, so this workflow needs only an Azure OIDC login — no container
# registry tokens, nothing pulled from GitHub at runtime. One workflow owns
# infrastructure AND code: a deploy that creates the budget and alerts is the only kind
# that cannot forget them (docs/22-low-cost-rebuild.md).
#
# infra/container-apps/deploy.ps1 does the same sequence from a workstation; use it when
# GitHub Actions is unavailable.
#
# One-time setup (Settings -> Environments -> prod):
#   secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  (OIDC federated credential
#            for a Contributor on the subscription; budgets need subscription scope)
#            POSTGRES_ADMIN_PASSWORD, CANI_TOKEN_SIGNING_SECRET, CANI_SESSION_SECRET  (>= 32 chars)
#            ENTRA_CLIENT_SECRET, AZURE_OPENAI_API_KEY, AZURE_DOCINTEL_API_KEY
#            AZURE_SPEECH_API_KEY   optional
#   vars:    ALERT_EMAIL            where budget and alert emails go (kept out of the repo)
#            CUSTOM_DOMAIN_PHASE    0 | 1 | 2, see main.bicep
#            RESOURCE_GROUP         default rg-cani-prod-eus
#            LOCATION               default eastus

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "db/**"
      - "infra/container-apps/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP || 'rg-cani-prod-eus' }}
      LOCATION: ${{ vars.LOCATION || 'eastus' }}
      CUSTOM_DOMAIN_PHASE: ${{ vars.CUSTOM_DOMAIN_PHASE || '0' }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Fail here, legibly, rather than twenty minutes in with an `az` usage dump.
      - name: Verify required secrets are set
        env:
          S1: ${{ secrets.AZURE_CLIENT_ID }}
          S2: ${{ secrets.AZURE_TENANT_ID }}
          S3: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          S5: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          S6: ${{ secrets.CANI_TOKEN_SIGNING_SECRET }}
          S7: ${{ secrets.CANI_SESSION_SECRET }}
          S8: ${{ secrets.ENTRA_CLIENT_SECRET }}
          S9: ${{ secrets.AZURE_OPENAI_API_KEY }}
          S10: ${{ secrets.AZURE_DOCINTEL_API_KEY }}
        run: |
          missing=()
          for pair in "S1:AZURE_CLIENT_ID" "S2:AZURE_TENANT_ID" "S3:AZURE_SUBSCRIPTION_ID" \
                      "S5:POSTGRES_ADMIN_PASSWORD" "S6:CANI_TOKEN_SIGNING_SECRET" "S7:CANI_SESSION_SECRET" \
                      "S8:ENTRA_CLIENT_SECRET" "S9:AZURE_OPENAI_API_KEY" "S10:AZURE_DOCINTEL_API_KEY"; do
            var=${pair%%:*}; name=${pair#*:}
            [ -n "${!var}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Unset secret(s) in the 'prod' environment: ${missing[*]}"
            exit 1
          fi
          [ -n "$ALERT_EMAIL" ] || { echo "::error::Unset variable ALERT_EMAIL in the 'prod' environment"; exit 1; }
          for var in S5 S6 S7; do
            [ ${#!var} -ge 32 ] || { echo "::error::$var must be at least 32 characters"; exit 1; }
          done

      - uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        run: |
          az group create --name "$RESOURCE_GROUP" --location "$LOCATION" \
            --tags project=cani environment=prod owner=jason managedBy=bicep -o none

      # Every deploy passes the same parameters; only deployApps differs between phases.
      - name: Phase 1 — registry, data, guardrails (no apps yet)
        id: phase1
        run: |
          az deployment group create \
            --name "phase1-${GITHUB_SHA::7}-$(date +%s)" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/container-apps/main.bicep \
            --parameters @infra/container-apps/main.parameters.json \
            --parameters \
              deployApps=false \
              imageTag="$GITHUB_SHA" \
              customDomainPhase="$CUSTOM_DOMAIN_PHASE" \
              alertEmail="$ALERT_EMAIL" \
              postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
              tokenSigningSecret="${{ secrets.CANI_TOKEN_SIGNING_SECRET }}" \
              sessionSecret="${{ secrets.CANI_SESSION_SECRET }}" \
              entraClientSecret="${{ secrets.ENTRA_CLIENT_SECRET }}" \
              azureOpenAIApiKey="${{ secrets.AZURE_OPENAI_API_KEY }}" \
              azureDocumentIntelligenceApiKey="${{ secrets.AZURE_DOCINTEL_API_KEY }}" \
              azureSpeechApiKey="${{ secrets.AZURE_SPEECH_API_KEY }}" \
            --query properties.outputs -o json > phase1.json
          echo "acr=$(jq -r .acrName.value phase1.json)" >> "$GITHUB_OUTPUT"

      - name: Build images in ACR
        run: |
          ACR="${{ steps.phase1.outputs.acr }}"
          for pair in "cani-hub-api:apps/hub-api/Dockerfile" "cani-docs-api:apps/docs-api/Dockerfile" \
                      "cani-retrieval-worker:apps/retrieval-worker/Dockerfile" \
                      "cani-ingestion-worker:apps/ingestion-worker/Dockerfile" \
                      "cani-web:apps/web/Dockerfile" "cani-migrate:db/Dockerfile"; do
            name=${pair%%:*}; file=${pair#*:}
            echo "::group::$name"
            az acr build --registry "$ACR" --image "$name:$GITHUB_SHA" --image "$name:latest" --file "$file" . -o none
            echo "::endgroup::"
          done

      - name: Phase 2 — apps and jobs
        id: deploy
        run: |
          az deployment group create \
            --name "phase2-${GITHUB_SHA::7}-$(date +%s)" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/container-apps/main.bicep \
            --parameters @infra/container-apps/main.parameters.json \
            --parameters \
              deployApps=true \
              imageTag="$GITHUB_SHA" \
              customDomainPhase="$CUSTOM_DOMAIN_PHASE" \
              alertEmail="$ALERT_EMAIL" \
              postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
              tokenSigningSecret="${{ secrets.CANI_TOKEN_SIGNING_SECRET }}" \
              sessionSecret="${{ secrets.CANI_SESSION_SECRET }}" \
              entraClientSecret="${{ secrets.ENTRA_CLIENT_SECRET }}" \
              azureOpenAIApiKey="${{ secrets.AZURE_OPENAI_API_KEY }}" \
              azureDocumentIntelligenceApiKey="${{ secrets.AZURE_DOCINTEL_API_KEY }}" \
              azureSpeechApiKey="${{ secrets.AZURE_SPEECH_API_KEY }}" \
            --query properties.outputs -o json > outputs.json
          echo "web_fqdn=$(jq -r .webAppFqdn.value outputs.json)" >> "$GITHUB_OUTPUT"
          echo "migrate_job=$(jq -r .migrateJobName.value outputs.json)" >> "$GITHUB_OUTPUT"
          echo "asuid=$(jq -r .customDomainVerificationId.value outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        run: |
          JOB="${{ steps.deploy.outputs.migrate_job }}"
          EXEC=$(az containerapp job start --name "$JOB" --resource-group "$RESOURCE_GROUP" --query name -o tsv)
          echo "execution: $EXEC"
          for i in $(seq 1 30); do
            STATUS=$(az containerapp job execution show --name "$JOB" --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$EXEC" --query properties.status -o tsv)
            echo "  $STATUS"
            case "$STATUS" in
              Succeeded) break ;;
              Failed|Stopped) az containerapp job logs show --name "$JOB" --resource-group "$RESOURCE_GROUP" \
                --execution "$EXEC" --container migrate --format text || true; exit 1 ;;
            esac
            sleep 10
          done
          [ "$STATUS" = "Succeeded" ] || { echo "::error::migration did not finish in 5 minutes"; exit 1; }
          az containerapp job logs show --name "$JOB" --resource-group "$RESOURCE_GROUP" \
            --execution "$EXEC" --container migrate --format text || true

      # The guardrails are the point. A deploy that leaves them missing is a failed deploy.
      - name: Assert guardrails exist
        run: |
          az consumption budget show --budget-name cani-prod-monthly -o none \
            || { echo "::error::budget cani-prod-monthly is missing"; exit 1; }
          for alert in cani-prod-web-5xx cani-prod-pg-cpu; do
            az monitor metrics alert show --name "$alert" --resource-group "$RESOURCE_GROUP" -o none \
              || { echo "::error::metric alert $alert is missing"; exit 1; }
          done
          az monitor scheduled-query show --name cani-prod-dead-letter --resource-group "$RESOURCE_GROUP" -o none \
            || { echo "::error::log alert cani-prod-dead-letter is missing"; exit 1; }
          echo "budget + 3 alerts present"

      - name: Smoke check
        run: |
          FQDN="${{ steps.deploy.outputs.web_fqdn }}"
          for i in $(seq 1 18); do
            if curl -fsS "https://$FQDN/api/health" >/dev/null; then echo "web healthy at https://$FQDN"; break; fi
            sleep 10
          done
          curl -fsS "https://$FQDN/api/health" >/dev/null || { echo "::error::web not healthy after 3 minutes"; exit 1; }
          STATE=$(az containerapp revision list --name retrieval-worker --resource-group "$RESOURCE_GROUP" \
            --query "[?properties.active] | [0].properties.healthState" -o tsv)
          echo "retrieval-worker active revision: ${STATE:-unknown}"
          echo "DNS for the custom domain: CNAME app -> $FQDN ; TXT asuid.app -> ${{ steps.deploy.outputs.asuid }}"
